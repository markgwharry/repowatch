name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the problem, before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: safety
    attributes:
      label: Could it push, delete or rewrite anything?
      description: If so, what should it refuse to do?
