[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repowatch"
dynamic = ["version"]
description = "Every git repo under a folder, compared across all its remotes, with fast-forward-only sync and safe branch pruning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mark Wharry" }]
keywords = ["git", "multi-repo", "remotes", "mirror", "gitea", "github", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/markgwharry/repowatch"
Issues = "https://github.com/markgwharry/repowatch/issues"
Changelog = "https://github.com/markgwharry/repowatch/blob/main/CHANGELOG.md"

[project.scripts]
repowatch = "repowatch.cli:main"

[tool.setuptools]
packages = ["repowatch"]

[tool.setuptools.dynamic]
version = { attr = "repowatch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E702", "E741"]   # short `a; b` fixture sequences; `l` for lines in comprehensions

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
